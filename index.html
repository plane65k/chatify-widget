      { title: 'Cities invest in resilience against extreme weather', domain: 'climate', url: 'https://www.bbc.com/news/science_and_environment' },
      { title: 'Clean energy adoption accelerates in several regions', domain: 'climate', url: 'https://www.bbc.com/news/science_and_environment' },
    ],
  };

  function renderArticles(articles, sourceLabel) {
    if (!articles.length) {
      listEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:8px;">No headlines right now.</div>';
      statusEl.textContent = 'No results';
      return;
    }
    listEl.innerHTML = articles.slice(0, 12).map(a => `
      <div class="news-item" data-url="${escapeAttr(a.url || '')}">
        <div class="src"><span>${escapeHtml(a.domain || a.source || 'news')}</span><span></span></div>
        <div class="title">${escapeHtml(a.title || 'Untitled')}</div>
      </div>
    `).join('');
    listEl.querySelectorAll('.news-item').forEach(item => {
      item.addEventListener('click', () => {
        const u = item.dataset.url;
        if (u) window.open(u, '_blank', 'noopener');
      });
    });
    statusEl.textContent = articles.length + ' headlines · ' + sourceLabel;
  }

  async function fetchFromHN() {
    const res = await fetch('https://hacker-news.firebaseio.com/v0/topstories.json');
    if (!res.ok) throw new Error('HN');
    const ids = (await res.json()).slice(0, 12);
    const stories = await Promise.all(ids.map(id =>
      fetch('https://hacker-news.firebaseio.com/v0/item/' + id + '.json')
        .then(r => r.ok ? r.json() : null).catch(() => null)
    ));
    return stories.filter(s => s && s.title && s.url)
      .map(s => ({ title: s.title, domain: 'HN', url: s.url }));
  }

  async function fetchFromGDELT(topic) {
    const q = encodeURIComponent(topic + ' sourcelang:english');
    const url = 'https://api.gdeltproject.org/api/v2/doc/doc?query=' + q + '&mode=artlist&maxrecords=10&format=json&sort=datedesc';
    const res = await fetch(url);
    const text = await res.text();
    if (!text.trim().startsWith('{')) throw new Error('non-json');
    const data = JSON.parse(text);
    const articles = (data.articles || []).filter(a => a.title && a.url)
      .map(a => ({ title: a.title, domain: a.domain || 'news', url: a.url }));
    if (!articles.length) throw new Error('empty');
    return articles;
  }

  async function fetchNews() {
    const now = Date.now();
    if (now - newsLastFetch < 5000) {
      statusEl.textContent = 'Please wait a moment…';
      return;
    }
    newsLastFetch = now;
    lastNewsTopic = topicEl.value;
    scheduleSave();
    statusEl.textContent = 'Loading…';
    listEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:8px;">Loading headlines…</div>';
    const topic = topicEl.value;

    try {
      if (topic === 'technology') {
        renderArticles(await fetchFromHN(), 'Hacker News');
        return;
      }
    } catch (e) { console.warn('HN', e); }

    try {
      renderArticles(await fetchFromGDELT(topic), 'News');
      return;
    } catch (e) { console.warn('GDELT', e); }

    const fallback = ENGLISH_FALLBACK[topic] || ENGLISH_FALLBACK.technology;
    renderArticles(fallback, 'sample');
    statusEl.textContent = 'Sample headlines (live feed busy)';
  }

  refreshBtn.addEventListener('click', fetchNews);
  topicEl.addEventListener('change', fetchNews);
  setTimeout(fetchNews, 250);
}

/* ================================================================
   WIDGET LOGIC — TIMERS (type + slider)
   ================================================================ */
function initTimers(el) {
  const listEl = el.querySelector('#timerList');
  const minInput = el.querySelector('#timerMinutes');
  const secInput = el.querySelector('#timerSeconds');
  const addBtn = el.querySelector('#timerAdd');
  const sliderMount = el.querySelector('#timerSliderMount');
  const sliderLabel = el.querySelector('#timerSliderLabel');
  let timerSeq = 0;
  const timers = new Map();
  let durationSlider = null;
  let suppressSlider = false;

  if (sliderMount) {
    durationSlider = createGlassSlider(sliderMount, {
      initialValue: 5,
      width: 260,
      height: 42,
      trackHeight: 10,
      thumbWidth: 60,
      thumbHeight: 42,
      thumbRadius: 21,
      bezelWidth: 10,
      glassThickness: 50,
      refractiveIndex: 1.45,
      restScale: 0.55,
      dragScale: 0.9,
      blurLevel: 0,
      specularOpacity: 0.3,
      specularSaturation: 5,
      onChange: (v) => {
        if (suppressSlider) return;
        const mins = Math.round(v);
        minInput.value = mins;
        secInput.value = 0;
        if (sliderLabel) sliderLabel.textContent = mins + ' min';
      },
    });
  }

  function syncFromInputs() {
    const m = Math.max(0, parseInt(minInput.value, 10) || 0);
    const s = Math.max(0, parseInt(secInput.value, 10) || 0);
    const totalMin = m + s / 60;
    suppressSlider = true;
    if (durationSlider) durationSlider.setValue(Math.min(100, totalMin));
    suppressSlider = false;
    if (sliderLabel) sliderLabel.textContent = m + 'm ' + s + 's';
  }

  minInput.addEventListener('input', syncFromInputs);
  secInput.addEventListener('input', syncFromInputs);

  function renderTimer(id) {
    const t = timers.get(id);
    if (!t) return;
    let row = listEl.querySelector(`[data-timer-id="${id}"]`);
    if (!row) {
      row = document.createElement('div');
      row.className = 'timer-row';
      row.dataset.timerId = id;
      row.innerHTML = `
        <div class="timer-top">
          <div class="timer-display" data-display>00:00</div>
          <div class="timer-actions">
            <button class="icon-btn" data-action="toggle">▶</button>
            <button class="icon-btn danger" data-action="remove">✕</button>
          </div>
        </div>
        <div style="font-size:9px;opacity:.45;margin-top:4px;" data-label>Timer</div>
      `;
      listEl.appendChild(row);
      row.querySelector('[data-action="toggle"]').addEventListener('click', () => {
        const timer = timers.get(id);
        if (!timer) return;
        if (timer.remaining <= 0) return;
        timer.running = !timer.running;
        if (timer.running) startTimer(id);
        row.querySelector('[data-action="toggle"]').textContent = timer.running ? '⏸' : '▶';
      });
      row.querySelector('[data-action="remove"]').addEventListener('click', () => {
        clearInterval(timers.get(id)?.interval);
        timers.delete(id);
        row.remove();
      });
    }
    const display = row.querySelector('[data-display]');
    const label = row.querySelector('[data-label]');
    const m = Math.floor(t.remaining / 60);
    const s = t.remaining % 60;
    display.innerHTML = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')} <small>left</small>`;
    label.textContent = t.label || 'Timer';
    const btn = row.querySelector('[data-action="toggle"]');
    btn.textContent = t.running ? '⏸' : '▶';
  }

  function startTimer(id) {
    const t = timers.get(id);
    if (!t) return;
    clearInterval(t.interval);
    t.interval = setInterval(() => {
      if (!t.running) return;
      if (t.remaining <= 0) {
        clearInterval(t.interval);
        t.running = false;
        toast('⏰ Timer finished!');
        renderTimer(id);
        return;
      }
      t.remaining--;
      renderTimer(id);
    }, 1000);
  }

  addBtn.addEventListener('click', () => {
    const m = Math.max(0, parseInt(minInput.value, 10) || 0);
    const s = Math.max(0, parseInt(secInput.value, 10) || 0);
    const total = m * 60 + s;
    if (total <= 0) { toast('Enter a duration'); return; }
    const id = ++timerSeq;
    timers.set(id, {
      remaining: total,
      running: true,
      label: `${m}m ${s}s`,
      interval: null,
    });
    renderTimer(id);
    startTimer(id);
  });
}

/* ================================================================
   WIDGET LOGIC — MUSIC + RADIO (Audius + Radio Browser mirrors)
   ================================================================ */
function initMusic(el) {
  const queryEl = el.querySelector('#musicQuery');
  const searchBtn = el.querySelector('#musicSearchBtn');
  const resultsEl = el.querySelector('#musicResults');
  const audio = el.querySelector('#musicAudio');
  const playBtn = el.querySelector('#musicPlayPause');
  const rewindBtn = el.querySelector('#musicRewind');
  const forwardBtn = el.querySelector('#musicForward');
  const npArt = el.querySelector('#npArt');
  const npTitle = el.querySelector('#npTitle');
  const npArtist = el.querySelector('#npArtist');
  const npCurrent = el.querySelector('#npCurrent');
  const npDuration = el.querySelector('#npDuration');
  const progressMount = el.querySelector('#musicProgressMount');
  const volumeMount = el.querySelector('#musicVolumeMount');
  const modeAudius = el.querySelector('#modeAudius');
  const modeRadio = el.querySelector('#modeRadio');

  let currentMode = 'audius';
  let currentTrack = null;
  let progressSlider = null;
  let volumeSlider = null;
  let suppressSliderUpdate = false;
  let lastMusicSearch = 0;
  let isRadioStream = false;

  if (progressMount) {
    progressSlider = createGlassSlider(progressMount, {
      initialValue: 0,
      width: 260,
      height: 42,
      trackHeight: 10,
      thumbWidth: 60,
      thumbHeight: 42,
      thumbRadius: 21,
      bezelWidth: 10,
      glassThickness: 50,
      refractiveIndex: 1.45,
      restScale: 0.55,
      dragScale: 0.9,
      blurLevel: 0,
      specularOpacity: 0.3,
      specularSaturation: 5,
      onChange: (v) => {
        if (suppressSliderUpdate || isRadioStream) return;
        if (!audio.duration || !isFinite(audio.duration)) return;
        audio.currentTime = (v / 100) * audio.duration;
      },
    });
  }

  if (volumeMount) {
    volumeSlider = createGlassSlider(volumeMount, {
      initialValue: 80,
      width: 260,
      height: 42,
      trackHeight: 10,
      thumbWidth: 60,
      thumbHeight: 42,
      thumbRadius: 21,
      bezelWidth: 10,
      glassThickness: 50,
      refractiveIndex: 1.45,
      restScale: 0.55,
      dragScale: 0.9,
      blurLevel: 0,
      specularOpacity: 0.3,
      specularSaturation: 5,
      onChange: (v) => {
        audio.volume = Math.max(0, Math.min(1, v / 100));
      },
    });
    audio.volume = 0.8;
  }

  function setMode(mode) {
    currentMode = mode;
    modeAudius.classList.toggle('active', mode === 'audius');
    modeRadio.classList.toggle('active', mode === 'radio');
    queryEl.placeholder = mode === 'radio' ? 'Search radio stations…' : 'Search songs…';
    queryEl.value = mode === 'radio' ? 'jazz' : 'lofi';
    resultsEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:6px;">Search for a ' + (mode === 'radio' ? 'station' : 'track') + '…</div>';
  }

  modeAudius.addEventListener('click', () => setMode('audius'));
  modeRadio.addEventListener('click', () => setMode('radio'));

  function formatTime(sec) {
    if (!sec || !isFinite(sec)) return '0:00';
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  function setPlayingUI(playing) {
    playBtn.textContent = playing ? '⏸' : '▶';
  }

  async function searchRadio(term) {
    const params = new URLSearchParams({
      name: term,
      limit: '12',
      order: 'clickcount',
      reverse: 'true',
      hidebroken: 'true',
      is_https: 'true',
    });
    const path = '/json/stations/search?' + params.toString();

    for (const mirror of RADIO_MIRRORS) {
      try {
        const res = await fetch(mirror + path);
        if (!res.ok) continue;
        const data = await res.json();
        if (Array.isArray(data) && data.length) return data;
      } catch (e) {
        console.warn('Radio mirror failed', mirror, e);
      }
    }
    throw new Error('All radio mirrors failed');
  }

  async function searchMusic() {
    const term = queryEl.value.trim();
    if (!term) return;
    const now = Date.now();
    if (now - lastMusicSearch < 1200) {
      toast('Please wait a moment between searches');
      return;
    }
    lastMusicSearch = now;

    resultsEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:6px;">Searching…</div>';

    if (currentMode === 'radio') {
      try {
        const stations = await searchRadio(term);
        if (!stations.length) {
          resultsEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:6px;">No stations found.</div>';
          return;
        }
        resultsEl.innerHTML = stations.map((s, i) => `
          <div class="music-result" data-index="${i}">
            <img src="${escapeAttr(s.favicon || '')}" alt="" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2738%27 height=%2738%27%3E%3Crect width=%2738%27 height=%2738%27 fill=%27%23333%27/%3E%3C/svg%3E'" />
            <div style="min-width:0;">
              <div class="m-title">${escapeHtml(s.name || 'Station')}</div>
              <div class="m-artist">${escapeHtml((s.country || '') + (s.tags ? ' · ' + s.tags.split(',')[0] : ''))}</div>
            </div>
          </div>
        `).join('');
        resultsEl.querySelectorAll('.music-result').forEach(item => {
          item.addEventListener('click', () => playStation(stations[parseInt(item.dataset.index, 10)]));
        });
      } catch (err) {
        console.error('Radio search error:', err);
        resultsEl.innerHTML = '<div style="font-size:11px;opacity:.6;padding:6px;">Radio search unavailable. Try again.</div>';
      }
      return;
    }

    try {
      const url = `https://api.audius.co/v1/tracks/search?query=${encodeURIComponent(term)}&limit=10`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const results = data.data || [];
      if (!results.length) {
        resultsEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:6px;">No results.</div>';
        return;
      }
      resultsEl.innerHTML = results.map((r, i) => `
        <div class="music-result" data-index="${i}">
          <img src="${escapeAttr(r.artwork?.['150x150'] || r.artwork?.['480x480'] || '')}" alt="" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2738%27 height=%2738%27%3E%3Crect width=%2738%27 height=%2738%27 fill=%27%23333%27/%3E%3C/svg%3E'" />
          <div style="min-width:0;">
            <div class="m-title">${escapeHtml(r.title || 'Unknown')}</div>
            <div class="m-artist">${escapeHtml(r.user?.name || r.user?.handle || '')}</div>
          </div>
        </div>
      `).join('');
      resultsEl.querySelectorAll('.music-result').forEach(item => {
        item.addEventListener('click', () => playTrack(results[parseInt(item.dataset.index, 10)]));
      });
    } catch (err) {
      console.error('Music search error:', err);
      resultsEl.innerHTML = '<div style="font-size:11px;opacity:.6;padding:6px;">Search unavailable. Try again in a moment.</div>';
    }
  }

  function playStation(station) {
    if (!station) return;
    const streamUrl = station.url_resolved || station.url;
    if (!streamUrl) {
      toast('No stream URL for this station');
      return;
    }
    isRadioStream = true;
    currentTrack = { type: 'radio', name: station.name, country: station.country };
    audio.src = streamUrl;
    audio.play().catch(() => toast('Playback failed — try another station'));
    npArt.src = station.favicon || '';
    npTitle.textContent = station.name || 'Radio';
    npArtist.textContent = (station.country || '') + (station.tags ? ' · ' + station.tags.split(',')[0] : '');
    npDuration.textContent = 'LIVE';
    npCurrent.textContent = '●';
    if (progressSlider) progressSlider.setValue(0);
    setPlayingUI(true);
    resultsEl.querySelectorAll('.music-result').forEach(el => el.classList.remove('active'));
    toast('Playing radio stream');
  }

  function playTrack(track) {
    if (!track || !track.id) {
      toast('No stream available for this track');
      return;
    }
    isRadioStream = false;
    currentTrack = track;
    audio.src = `https://api.audius.co/v1/tracks/${track.id}/stream`;
    audio.play().catch(() => toast('Playback failed – try another track'));
    npArt.src = track.artwork?.['480x480'] || track.artwork?.['150x150'] || '';
    npTitle.textContent = track.title || 'Unknown';
    npArtist.textContent = track.user?.name || track.user?.handle || '';
    npDuration.textContent = formatTime(track.duration || 0);
    npCurrent.textContent = '0:00';
    if (progressSlider) progressSlider.setValue(0);
    setPlayingUI(true);
    resultsEl.querySelectorAll('.music-result').forEach(el => el.classList.remove('active'));
    toast('Playing full track');
  }

  playBtn.addEventListener('click', () => {
    if (!currentTrack) { toast('Pick a track or station first'); return; }
    if (audio.paused) {
      audio.play().catch(() => {});
      setPlayingUI(true);
    } else {
      audio.pause();
      setPlayingUI(false);
    }
  });

  rewindBtn.addEventListener('click', () => {
    if (isRadioStream) return;
    audio.currentTime = Math.max(0, audio.currentTime - 10);
  });
  forwardBtn.addEventListener('click', () => {
    if (isRadioStream) return;
    audio.currentTime = Math.min(audio.duration || 999, audio.currentTime + 10);
  });

  searchBtn.addEventListener('click', searchMusic);
  queryEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchMusic(); });

  audio.addEventListener('timeupdate', () => {
    if (isRadioStream) {
      npCurrent.textContent = '● LIVE';
      return;
    }
    if (!audio.duration || !isFinite(audio.duration)) return;
    const pct = (audio.currentTime / audio.duration) * 100;
    suppressSliderUpdate = true;
    if (progressSlider) progressSlider.setValue(pct);
    suppressSliderUpdate = false;
    npCurrent.textContent = formatTime(audio.currentTime);
    npDuration.textContent = formatTime(audio.duration);
  });

  audio.addEventListener('play', () => setPlayingUI(true));
  audio.addEventListener('pause', () => setPlayingUI(false));
  audio.addEventListener('ended', () => {
    setPlayingUI(false);
    if (progressSlider && !isRadioStream) progressSlider.setValue(100);
  });
  audio.addEventListener('error', () => {
    toast('Audio stream failed to load');
    setPlayingUI(false);
  });

  setTimeout(searchMusic, 400);
}

function initClock(el) {
  const face = el.querySelector('#clockFace');
  const dateEl = el.querySelector('#clockDate');
  const mount = el.querySelector('#clock24Mount');
  let use24 = true;

  if (mount) {
    createGlassSwitch(mount, {
      checked: true,
      label: '24-hour',
      onChange: (v) => {
        use24 = v;
        tick();
      },
    });
  }

  function tick() {
    const now = new Date();
    let h = now.getHours();
    let suffix = '';
    if (!use24) {
      suffix = h >= 12 ? ' PM' : ' AM';
      h = h % 12 || 12;
    }
    face.textContent = String(h).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + suffix;
    dateEl.textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
  }
  tick();
  setInterval(tick, 1000);
}

/* ================================================================
   WIDGET LOGIC — CALCULATOR
   ================================================================ */
function initCalculator(el) {
  const display = el.querySelector('#calcDisplay');
  const grid = el.querySelector('#calcGrid');
  let expr = '';

  function update() { display.textContent = expr || '0'; }

  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const c = btn.dataset.c;
    if (c === 'C') { expr = ''; update(); return; }
    if (c === '⌫') { expr = expr.slice(0, -1); update(); return; }
    if (c === '=') {
      try {
        if (!/^[0-9+\-*/.%() ]+$/.test(expr)) throw new Error('bad');
        const result = Function('"use strict";return (' + expr.replace(/%/g, '/100') + ')')();
        if (!isFinite(result)) throw new Error('inf');
        expr = String(Math.round(result * 1e10) / 1e10);
      } catch {
        expr = 'Error';
      }
      update();
      return;
    }
    if (expr === 'Error') expr = '';
    expr += c;
    update();
  });
  update();
}

/* ================================================================
   HELPERS
   ================================================================ */
function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function escapeAttr(str) {
  return escapeHtml(str).replace(/`/g, '&#96;');
}

   WIDGET CATALOG PANEL

function closePanel(id) {
  document.getElementById(id)?.classList.remove('open');
}

function togglePanel(id) {
  const p = document.getElementById(id);
  if (!p) return;
  const willOpen = !p.classList.contains('open');
  document.querySelectorAll('.panel.open').forEach(x => x.classList.remove('open'));
  if (willOpen) p.classList.add('open');
}

      }
      if (file.size > 8 * 1024 * 1024) {
        toast('Image too large (max ~8MB)');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        lastBgDataUrl = reader.result;
        lastBgUrl = null;
        bgLayer.style.backgroundImage =
          'linear-gradient(rgba(6,7,11,.4), rgba(6,7,11,.5)), url("' + reader.result + '")';
        bgLayer.style.backgroundSize = 'cover';
        bgLayer.style.backgroundPosition = 'center';
        document.querySelectorAll('.bg-preset').forEach(el => el.classList.remove('active'));
        scheduleSave();
        toast('Background uploaded');
      };
      reader.onerror = () => toast('Could not read file');
      reader.readAsDataURL(file);
    });
  }

  document.getElementById('resetLayoutChip').addEventListener('click', () => {
    let i = 0;
    widgetState.widgets.forEach((rec) => {
      rec.x = 40 + (i % 4) * 40;
      rec.y = 40 + Math.floor(i / 4) * 40;
      rec.el.style.left = rec.x + 'px';
      rec.el.style.top = rec.y + 'px';
      i++;
    });
    scheduleSave();
    toast('Layout reset');
  });

  initMasterSlider();

  const saved = loadState();
  if (saved && Array.isArray(saved.widgets) && saved.widgets.length) {
    if (typeof saved.glassiness === 'number' && masterSlider) {
      masterSlider.setValue(saved.glassiness);
      updateGlassiness(saved.glassiness);
    }
    if (saved.bgDataUrl) {
      lastBgDataUrl = saved.bgDataUrl;
      lastBgUrl = null;
      bgLayer.style.backgroundImage =
        'linear-gradient(rgba(6,7,11,.4), rgba(6,7,11,.5)), url("' + saved.bgDataUrl + '")';
      bgLayer.style.backgroundSize = 'cover';
      bgLayer.style.backgroundPosition = 'center';
      document.querySelectorAll('.bg-preset').forEach(el => el.classList.remove('active'));
    } else if (saved.bgUrl) {
      applyBgUrl(saved.bgUrl);
      document.getElementById('bgUrlInput').value = saved.bgUrl;
    } else if (typeof saved.bgIndex === 'number') {
      applyBackground(saved.bgIndex);
    }
    if (saved.showGrid === false) {
      document.body.classList.add('no-grid');
      if (gridSwitch) gridSwitch.setChecked(false);
    }
    if (saved.darkTint === false) {
      document.documentElement.style.setProperty('--text-primary', '#1a1f2e');
      document.documentElement.style.setProperty('--text-secondary', 'rgba(0,0,0,.55)');
      if (darkSwitch) darkSwitch.setChecked(false);
    }
    if (saved.newsTopic) lastNewsTopic = saved.newsTopic;
    if (saved.weatherQuery) lastWeatherQuery = saved.weatherQuery;
    if (saved.weatherUnit) lastWeatherUnit = saved.weatherUnit;

    saved.widgets.forEach(w => {
      addWidget(w.type, w.x, w.y, w.id, w.locked, w.w, w.h);
    });

    if (saved.locked) {
      setLocked(true);
      if (lockSwitch) lockSwitch.setChecked(true);
    }
  } else {
    addWidget('weather', 32, 32);
    addWidget('tasks', 380, 32);
    addWidget('news', 32, 340);
    addWidget('music', 380, 340);
    addWidget('timers', 730, 32);
    addWidget('clock', 730, 340);
  }

  window.addEventListener('resize', () => {
    if (masterSlider) masterSlider.refresh();
  });

  document.addEventListener('pointerdown', (e) => {
    if (!e.target.closest('.panel') && !e.target.closest('#addWidgetChip') && !e.target.closest('#settingsChip')) {
      document.querySelectorAll('.panel.open').forEach(p => p.classList.remove('open'));
    }
  });

  window.addEventListener('beforeunload', saveState);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

<script src="https://accounts.google.com/gsi/client" async defer></script>
