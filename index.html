<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chatify Widgets — Liquid Glass</title>
<style>
/* ============================================================
   GLOBAL / THEME
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

:root {
  --glassiness: 55;
  --text-primary: #f4f6fb;
  --text-secondary: rgba(255,255,255,0.66);
  --panel-border: rgba(255,255,255,0.14);
  --panel-bg: rgba(255,255,255,0.07);
  --shadow: 0 18px 50px rgba(0,0,0,0.45);
  --radius: 22px;
}

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #06070b;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   BACKGROUND
   ============================================================ */
#bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(120% 100% at 10% 0%, #1d2542 0%, transparent 60%),
    radial-gradient(100% 90% at 95% 10%, #3a1c4d 0%, transparent 55%),
    radial-gradient(80% 80% at 50% 110%, #0b3d4a 0%, transparent 60%),
    linear-gradient(135deg, #070912, #11162a 55%, #090b12);
  background-size: cover;
  background-position: center;
  transition: background-image .4s ease, background-color .4s ease;
}
#bg-layer::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  pointer-events: none;
}
body.no-grid #bg-layer::after { display: none; }

/* ============================================================
   GLASS UTILITIES
   ============================================================ */
.glass {
  background: rgba(255,255,255, calc(0.06 + (var(--glassiness) / 100) * 0.07));
  backdrop-filter: blur(calc(4px + (var(--glassiness) / 100) * 28px))
                  saturate(calc(1.1 + (var(--glassiness) / 100) * 0.9));
  -webkit-backdrop-filter: blur(calc(4px + (var(--glassiness) / 100) * 28px))
                           saturate(calc(1.1 + (var(--glassiness) / 100) * 0.9));
  border: 1px solid rgba(255,255,255, calc(0.08 + (var(--glassiness) / 100) * 0.12));
  box-shadow: var(--shadow),
              inset 0 1px 0 rgba(255,255,255,0.18),
              inset 0 -1px 0 rgba(0,0,0,0.18);
}
.glass-soft {
  background: rgba(255,255,255,0.055);
  backdrop-filter: blur(calc(3px + (var(--glassiness) / 100) * 18px));
  -webkit-backdrop-filter: blur(calc(3px + (var(--glassiness) / 100) * 18px));
  border: 1px solid rgba(255,255,255,0.10);
}

/* ============================================================
   APP SHELL — full screen widget area
   ============================================================ */
#app {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0;
  gap: 0;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 16px;
  border-radius: 0 0 18px 18px;
  flex: 0 0 auto;
  z-index: 20;
  margin: 0 12px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 700;
  letter-spacing: .02em;
}
.brand img.logo {
  width: 34px;
  height: 34px;
  object-fit: contain;
  border-radius: 8px;
  filter: drop-shadow(0 0 12px rgba(125,200,255,.35));
}
.brand small { display:block; font-size:10px; font-weight:500; opacity:.6; letter-spacing:.14em; }
.spacer { flex: 1; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  user-select: none;
  border: 1px solid rgba(255,255,255,0.14);
  background: rgba(255,255,255,0.06);
  color: inherit;
  font-family: inherit;
  transition: background .2s, border-color .2s, transform .15s;
  white-space: nowrap;
}
.chip:hover { background: rgba(255,255,255,0.12); }
.chip:active { transform: scale(.97); }
.chip.active {
  background: rgba(120,170,255,.22);
  border-color: rgba(140,190,255,.55);
  box-shadow: 0 0 0 1px rgba(140,190,255,.15), 0 0 22px rgba(90,150,255,.18);
}

/* ============================================================
   DASHBOARD CANVAS — entire remaining screen
   ============================================================ */
#dashboard {
  position: relative;
  flex: 1;
  border-radius: 0;
  overflow: hidden;
  outline: none;
  min-height: 0;
}

/* ============================================================
   WIDGETS (resizable)
   ============================================================ */
.widget {
  position: absolute;
  min-width: 240px;
  min-height: 180px;
  max-width: 90vw;
  max-height: 85vh;
  border-radius: var(--radius);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  z-index: 10;
  transform-origin: top left;
  transition: box-shadow .2s, border-color .2s;
  touch-action: none;
}
.widget.dragging {
  z-index: 99;
  box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.2);
  transition: none;
}
.widget.resizing {
  z-index: 99;
  transition: none;
}
.widget.locked { cursor: default; }

.widget-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px 10px;
  cursor: grab;
  user-select: none;
  flex: 0 0 auto;
}
.widget.locked .widget-head { cursor: default; }
.widget-head:active { cursor: grabbing; }
.widget-head .drag-grip {
  width: 18px; height: 10px;
  background-image: radial-gradient(circle, rgba(255,255,255,.5) 1.2px, transparent 1.4px);
  background-size: 6px 6px;
  opacity: .55;
  flex: 0 0 auto;
  pointer-events: none;
}
.widget-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  opacity: .78;
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}
.widget-actions {
  display: flex;
  gap: 6px;
  opacity: 0;
  transition: opacity .18s;
}
.widget:hover .widget-actions { opacity: 1; }
.widget.locked .widget-actions .lock-btn { opacity: 1; }
.icon-btn {
  width: 26px; height: 26px;
  border-radius: 9px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(255,255,255,.06);
  color: var(--text-secondary);
  font-size: 13px;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: background .15s, color .15s;
}
.icon-btn:hover { background: rgba(255,255,255,.14); color: #fff; }
.icon-btn.danger:hover { background: rgba(255,90,110,.22); color: #ffb3c0; }

.widget-body {
  padding: 0 16px 16px;
  flex: 1;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.2) transparent;
  min-height: 0;
}
.widget-body::-webkit-scrollbar { width: 6px; }
.widget-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }

/* Resize handle */
.resize-handle {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 18px;
  height: 18px;
  cursor: nwse-resize;
  z-index: 5;
  opacity: 0;
  transition: opacity .15s;
}
.widget:hover .resize-handle { opacity: .7; }
.widget.locked .resize-handle { display: none; }
.resize-handle::after {
  content: "";
  position: absolute;
  right: 4px;
  bottom: 4px;
  width: 10px;
  height: 10px;
  border-right: 2px solid rgba(255,255,255,.45);
  border-bottom: 2px solid rgba(255,255,255,.45);
  border-radius: 0 0 3px 0;
}

.widget.w-sm { width: 280px; }
.widget.w-md { width: 330px; }
.widget.w-lg { width: 400px; }
.widget.h-sm .widget-body { max-height: none; }
.widget.h-md .widget-body { max-height: none; }
.widget.h-lg .widget-body { max-height: none; }

/* ============================================================
   WEATHER
   ============================================================ */
.weather-main {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 4px 0 14px;
}
.weather-icon { font-size: 44px; line-height: 1; filter: drop-shadow(0 4px 14px rgba(120,180,255,.35)); }
.weather-temp { font-size: 46px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.weather-meta { font-size: 12px; color: var(--text-secondary); line-height: 1.6; margin-top: 2px; }
.weather-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.mini-stat {
  border-radius: 14px;
  padding: 10px 12px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
}
.mini-stat .k { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; opacity: .55; }
.mini-stat .v { font-size: 16px; font-weight: 700; margin-top: 2px; }
.status-line { font-size: 11px; opacity: .55; margin-top: 10px; display: flex; align-items: center; gap: 6px; }

.weather-loc-row {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.weather-loc-row input {
  flex: 1;
  min-width: 0;
  padding: 9px 11px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.18);
  color: #fff;
  font-size: 12px;
  outline: none;
}
.weather-loc-row input:focus { border-color: rgba(140,190,255,.55); }

.unit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  font-size: 12px;
}

/* ============================================================
   TASKS
   ============================================================ */
.task-list { display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.task-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 12px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.06);
  transition: background .15s;
}
.task-row:hover { background: rgba(255,255,255,.09); }
.task-row.done { opacity: .45; }
.task-row.done .task-title { text-decoration: line-through; }
.task-check {
  width: 18px; height: 18px; border-radius: 6px;
  border: 1.5px solid rgba(255,255,255,.35);
  flex: 0 0 auto;
  cursor: pointer;
  margin-top: 1px;
  display: grid;
  place-items: center;
  font-size: 11px;
  color: transparent;
  transition: background .15s, border-color .15s;
}
.task-row.done .task-check {
  background: #6dffb0;
  border-color: #6dffb0;
  color: #052513;
}
.task-title { font-size: 13px; line-height: 1.35; word-break: break-word; }
.task-notes { font-size: 11px; opacity: .55; margin-top: 2px; }
.task-input-row {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}
.task-input-row input {
  flex: 1;
  min-width: 0;
  padding: 9px 11px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.18);
  color: #fff;
  font-size: 12px;
  outline: none;
}
.task-input-row input:focus { border-color: rgba(140,190,255,.55); }

/* ============================================================
   NEWS
   ============================================================ */
.news-list { display: flex; flex-direction: column; gap: 8px; margin-top: 2px; }
.news-item {
  padding: 10px 11px;
  border-radius: 12px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.06);
  transition: background .15s, transform .12s;
  cursor: pointer;
}
.news-item:hover { background: rgba(255,255,255,.1); transform: translateX(2px); }
.news-item .src {
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  opacity: .45;
  margin-bottom: 3px;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.news-item .title { font-size: 12.5px; line-height: 1.4; font-weight: 600; }

/* ============================================================
   TIMERS
   ============================================================ */
.timer-list { display: flex; flex-direction: column; gap: 10px; }
.timer-row {
  padding: 12px;
  border-radius: 16px;
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(255,255,255,.07);
}
.timer-row .timer-top { display: flex; align-items: center; gap: 10px; }
.timer-display {
  font-family: "SF Mono", Monaco, monospace;
  font-size: 26px;
  font-weight: 700;
  letter-spacing: .04em;
  font-variant-numeric: tabular-nums;
  flex: 1;
}
.timer-display small { font-size: 12px; opacity: .5; font-weight: 500; }
.timer-actions { display: flex; gap: 6px; }
.timer-setup { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.timer-setup-row { display: flex; gap: 6px; align-items: center; }
.timer-setup input {
  width: 70px;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.18);
  color: #fff;
  font-size: 13px;
  outline: none;
  text-align: center;
}
.timer-setup button { flex: 1; }
.timer-label { font-size: 10px; opacity: .5; margin-bottom: 4px; letter-spacing: .08em; text-transform: uppercase; }
.timer-slider-mount { width: 100%; margin-top: 4px; }

/* ============================================================
   MUSIC / RADIO
   ============================================================ */
.music-mode-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
}
.music-mode-row .chip { flex: 1; justify-content: center; font-size: 11px; }
.music-search { display: flex; gap: 6px; margin-bottom: 10px; }
.music-search input {
  flex: 1;
  min-width: 0;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.12);
  background: rgba(0,0,0,.2);
  color: #fff;
  font-size: 12px;
  outline: none;
}
.music-search input:focus { border-color: rgba(140,190,255,.55); }
.music-results { display: flex; flex-direction: column; gap: 6px; max-height: 170px; overflow: auto; margin-bottom: 12px; }
.music-result {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px;
  border-radius: 11px;
  cursor: pointer;
  background: rgba(255,255,255,.045);
  border: 1px solid transparent;
  transition: background .15s, border-color .15s;
}
.music-result:hover { background: rgba(255,255,255,.1); }
.music-result.active { border-color: rgba(140,190,255,.5); background: rgba(100,150,255,.12); }
.music-result img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; background: rgba(255,255,255,.08); }
.music-result .m-title { font-size: 12px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.music-result .m-artist { font-size: 10.5px; opacity: .55; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.now-playing {
  padding: 10px 12px;
  border-radius: 16px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.08);
}
.np-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.np-art { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,.08); }
.np-info { min-width: 0; flex: 1; }
.np-title { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-artist { font-size: 11px; opacity: .55; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.np-controls { display: flex; gap: 8px; align-items: center; margin: 10px 0 6px; }
.np-controls .icon-btn { width: 34px; height: 34px; border-radius: 50%; font-size: 14px; }
.np-controls .play-btn {
  width: 42px; height: 42px; border-radius: 50%;
  background: rgba(255,255,255,.16);
  border: 1px solid rgba(255,255,255,.2);
  font-size: 16px;
}
.np-time { font-size: 10px; opacity: .5; font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; margin-top: 2px; }

/* ============================================================
   CLOCK / NOTES / CALCULATOR
   ============================================================ */
.clock-face {
  font-family: "SF Mono", Monaco, monospace;
  font-size: 40px;
  font-weight: 800;
  letter-spacing: -.02em;
  text-align: center;
  padding: 10px 0 4px;
  font-variant-numeric: tabular-nums;
}
.clock-date { text-align: center; font-size: 11px; opacity: .55; margin-bottom: 8px; }
.note-area {
  width: 100%;
  min-height: 120px;
  resize: vertical;
  border-radius: 12px;
  border: 1px solid rgba(255,255,255,.1);
  background: rgba(0,0,0,.18);
  color: #fff;
  font-size: 12px;
  line-height: 1.5;
  padding: 10px;
  outline: none;
  font-family: inherit;
}
.note-area:focus { border-color: rgba(140,190,255,.5); }
.calc-display {
  font-family: "SF Mono", Monaco, monospace;
  font-size: 26px;
  text-align: right;
  padding: 10px 12px;
  border-radius: 12px;
  background: rgba(0,0,0,.22);
  border: 1px solid rgba(255,255,255,.1);
  margin-bottom: 8px;
  overflow: hidden;
  min-height: 52px;
}
.calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.calc-grid button {
  padding: 10px 0;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.08);
  background: rgba(255,255,255,.06);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  transition: background .15s;
}
.calc-grid button:hover { background: rgba(255,255,255,.14); }
.calc-grid button.op { background: rgba(110,160,255,.18); }
.calc-grid button.eq { background: rgba(110,255,170,.2); }

/* ============================================================
   LIQUID GLASS SLIDER
   ============================================================ */
.lg-slider-container {
  position: relative;
  width: 330px;
  height: 60px;
  flex: 0 0 auto;
  margin: 0 auto;
}
.lg-slider-track {
  display: inline-block;
  position: absolute;
  width: 330px;
  height: 14px;
  left: 0;
  top: 23px;
  background-color: #89898f66;
  border-radius: 7px;
  cursor: pointer;
}
.lg-slider-track-inner {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border-radius: 7px;
}
.lg-slider-fill {
  height: 14px;
  width: 10%;
  border-radius: 6px;
  background-color: #0377f7;
}
.lg-slider-thumb {
  position: absolute;
  width: 90px;
  height: 60px;
  top: 0;
  border-radius: 30px;
  transform: scale(0.6);
  transform-origin: center center;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  background-color: rgba(255, 255, 255, 1);
  box-shadow: 0 3px 14px rgba(0, 0, 0, 0.1);
  overflow: hidden;
  will-change: transform, background-color;
}
.lg-slider-thumb-clone {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  border-radius: inherit;
  z-index: 1;
  opacity: 0;
  will-change: opacity;
}
.lg-slider-thumb-clone-inner {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  background: linear-gradient(145deg, rgba(255,255,255,0.55), rgba(200,210,230,0.35));
}
.lg-slider-thumb-clone-inner::before {
  content: "";
  position: absolute;
  left: var(--track-left, 0);
  top: var(--track-top, 0);
  width: 330px;
  height: 14px;
  border-radius: 7px;
  background-color: #89898f66;
  overflow: hidden;
}
.lg-slider-thumb-clone-inner::after {
  content: "";
  position: absolute;
  left: var(--track-left, 0);
  top: var(--track-top, 0);
  width: calc(330px * var(--fill-width, 10) / 100);
  height: 14px;
  border-radius: 6px;
  background-color: #0377f7;
}
.lg-slider-thumb-inner {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  border-radius: inherit;
  z-index: 3;
  pointer-events: none;
}
.lg-glass-filter-svg {
  position: absolute;
  width: 0; height: 0;
  overflow: hidden;
  pointer-events: none;
}

/* ============================================================
   LIQUID GLASS SWITCH / TOGGLE
   ============================================================ */
.lg-switch-container {
  position: relative;
  display: inline-block;
  vertical-align: middle;
}
.lg-switch-track {
  display: inline-block;
  position: relative;
  width: 72px;
  height: 34px;
  background-color: #94949f77;
  border-radius: 17px;
  cursor: pointer;
  transition: background-color .2s;
}
.lg-switch-thumb {
  position: absolute;
  width: 66px;
  height: 42px;
  border-radius: 21px;
  top: 17px;
  transform: translateY(-50%) scale(0.65);
  transform-origin: center center;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  background-color: rgba(255, 255, 255, 1);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
  overflow: hidden;
  will-change: transform, left, background-color, box-shadow;
}
.lg-switch-thumb-clone {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  border-radius: inherit;
  z-index: 1;
  opacity: 0;
  will-change: opacity;
}
.lg-switch-thumb-clone-inner {
  position: absolute;
  top: 0; left: 0;
  pointer-events: none;
  background: linear-gradient(145deg, rgba(255,255,255,0.5), rgba(180,200,220,0.3));
}
.lg-switch-thumb-clone-inner::before {
  content: "";
  position: absolute;
  left: var(--track-left, 0);

<script>
/* ================================================================
   API NOTES
   ================================================================
   Weather  — Open-Meteo (no key). Geocoding via Open-Meteo too.
   News     — GDELT DOC 2 (no key). Hard rate-limit 1 req / 6s.
   Music    — Audius (free tracks) + Radio Browser mirrors (CORS-safe).
   Tasks    — Google Tasks OAuth (optional; set GOOGLE_CLIENT_ID).
   ================================================================ */

const GOOGLE_CLIENT_ID = 'YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com';
const GOOGLE_SCOPES = 'https://www.googleapis.com/auth/tasks';
const STORAGE_KEY = 'chatify_widgets_v1';

/* Radio Browser CORS-safe mirrors (never hit radio-browser.info directly) */
const RADIO_MIRRORS = [
  'https://de1.api.radio-browser.info',
  'https://nl1.api.radio-browser.info',
  'https://at1.api.radio-browser.info',
  'https://all.api.radio-browser.info'
];

/* ================================================================
   SURFACE EQUATIONS / SPRING / DISPLACEMENT
   ================================================================ */
const SurfaceEquations = {
  convex_circle: (x) => Math.sqrt(1 - Math.pow(1 - x, 2)),
  convex_squircle: (x) => Math.pow(1 - Math.pow(1 - x, 4), 1 / 4),
  concave: (x) => 1 - Math.sqrt(1 - Math.pow(x, 2)),
  lip: (x) => {
    const convex = Math.pow(1 - Math.pow(1 - Math.min(x * 2, 1), 4), 1 / 4);
    const concave = 1 - Math.sqrt(1 - Math.pow(1 - x, 2)) + 0.1;
    const smootherstep = 6 * Math.pow(x, 5) - 15 * Math.pow(x, 4) + 10 * Math.pow(x, 3);
    return convex * (1 - smootherstep) + concave * smootherstep;
  },
};

class Spring {
  constructor(value, stiffness = 300, damping = 20) {
    this.value = value;
    this.target = value;
    this.velocity = 0;
    this.stiffness = stiffness;
    this.damping = damping;
  }
  setTarget(target) { this.target = target; }
  update(dt) {
    const force = (this.target - this.value) * this.stiffness;
    const dampingForce = this.velocity * this.damping;
    this.velocity += (force - dampingForce) * dt;
    this.value += this.velocity * dt;
    return this.value;
  }
  isSettled() {
    return Math.abs(this.target - this.value) < 0.001 && Math.abs(this.velocity) < 0.001;
  }
}

function calculateDisplacementMap1D(glassThickness, bezelWidth, surfaceFn, refractiveIndex, samples = 128) {
  const eta = 1 / refractiveIndex;
  function refract(normalX, normalY) {
    const dot = normalY;
    const k = 1 - eta * eta * (1 - dot * dot);
    if (k < 0) return null;
    const kSqrt = Math.sqrt(k);
    return [
      -(eta * dot + kSqrt) * normalX,
      eta - (eta * dot + kSqrt) * normalY,
    ];
  }
  const result = [];
  for (let i = 0; i < samples; i++) {
    const x = i / samples;
    const y = surfaceFn(x);
    const dx = x < 1 ? 0.0001 : -0.0001;
    const y2 = surfaceFn(Math.max(0, Math.min(1, x + dx)));
    const derivative = (y2 - y) / dx;
    const magnitude = Math.sqrt(derivative * derivative + 1);
    const normal = [-derivative / magnitude, -1 / magnitude];
    const refracted = refract(normal[0], normal[1]);
    if (!refracted) {
      result.push(0);
    } else {
      const remainingHeightOnBezel = y * bezelWidth;
      const remainingHeight = remainingHeightOnBezel + glassThickness;
      result.push(refracted[0] * (remainingHeight / refracted[1]));
    }
  }
  return result;
}

function calculateDisplacementMap2D(canvasWidth, canvasHeight, objectWidth, objectHeight, radius, bezelWidth, maximumDisplacement, precomputedMap) {
  const imageData = new ImageData(canvasWidth, canvasHeight);
  for (let i = 0; i < imageData.data.length; i += 4) {
    imageData.data[i] = 128;
    imageData.data[i + 1] = 128;
    imageData.data[i + 2] = 0;
    imageData.data[i + 3] = 255;
  }
  const radiusSquared = radius * radius;
  const radiusPlusOneSquared = (radius + 1) * (radius + 1);
  const radiusMinusBezelSquared = Math.max(0, (radius - bezelWidth) * (radius - bezelWidth));
  const widthBetweenRadiuses = objectWidth - radius * 2;
  const heightBetweenRadiuses = objectHeight - radius * 2;
  const objectX = (canvasWidth - objectWidth) / 2;
  const objectY = (canvasHeight - objectHeight) / 2;

  for (let y1 = 0; y1 < objectHeight; y1++) {
    for (let x1 = 0; x1 < objectWidth; x1++) {
      const idx = ((objectY + y1) * canvasWidth + objectX + x1) * 4;
      const isOnLeftSide = x1 < radius;
      const isOnRightSide = x1 >= objectWidth - radius;
      const isOnTopSide = y1 < radius;
      const isOnBottomSide = y1 >= objectHeight - radius;

      const x = isOnLeftSide ? x1 - radius : isOnRightSide ? x1 - radius - widthBetweenRadiuses : 0;
      const y = isOnTopSide ? y1 - radius : isOnBottomSide ? y1 - radius - heightBetweenRadiuses : 0;

      const distanceToCenterSquared = x * x + y * y;
      const isInBezel =
        distanceToCenterSquared <= radiusPlusOneSquared &&
        distanceToCenterSquared >= radiusMinusBezelSquared;

      if (isInBezel) {
        const opacity = distanceToCenterSquared < radiusSquared
          ? 1
          : 1 - (Math.sqrt(distanceToCenterSquared) - Math.sqrt(radiusSquared)) /
            (Math.sqrt(radiusPlusOneSquared) - Math.sqrt(radiusSquared));
        const distanceFromCenter = Math.sqrt(distanceToCenterSquared);
        const distanceFromSide = radius - distanceFromCenter;
        const cos = distanceFromCenter > 0 ? x / distanceFromCenter : 0;
        const sin = distanceFromCenter > 0 ? y / distanceFromCenter : 0;
        const bezelRatio = Math.max(0, Math.min(1, distanceFromSide / bezelWidth));
        const bezelIndex = Math.floor(bezelRatio * precomputedMap.length);
        const distance = precomputedMap[Math.max(0, Math.min(bezelIndex, precomputedMap.length - 1))] || 0;
        const dX = maximumDisplacement > 0 ? (-cos * distance) / maximumDisplacement : 0;
        const dY = maximumDisplacement > 0 ? (-sin * distance) / maximumDisplacement : 0;

        imageData.data[idx] = Math.max(0, Math.min(255, 128 + dX * 127 * opacity));
        imageData.data[idx + 1] = Math.max(0, Math.min(255, 128 + dY * 127 * opacity));
        imageData.data[idx + 2] = 0;
        imageData.data[idx + 3] = 255;
      }
    }
  }
  return imageData;
}

function calculateSpecularHighlight(objectWidth, objectHeight, radius, bezelWidth, specularAngle = Math.PI / 3) {
  const imageData = new ImageData(objectWidth, objectHeight);
  const specularVector = [Math.cos(specularAngle), Math.sin(specularAngle)];
  const specularThickness = 1.5;
  const radiusSquared = radius * radius;
  const radiusPlusOneSquared = (radius + 1) * (radius + 1);
  const radiusMinusSpecularSquared = Math.max(0, (radius - specularThickness) * (radius - specularThickness));
  const widthBetweenRadiuses = objectWidth - radius * 2;
  const heightBetweenRadiuses = objectHeight - radius * 2;

  for (let y1 = 0; y1 < objectHeight; y1++) {
    for (let x1 = 0; x1 < objectWidth; x1++) {
      const idx = (y1 * objectWidth + x1) * 4;
      const isOnLeftSide = x1 < radius;
      const isOnRightSide = x1 >= objectWidth - radius;
      const isOnTopSide = y1 < radius;
      const isOnBottomSide = y1 >= objectHeight - radius;

      const x = isOnLeftSide ? x1 - radius : isOnRightSide ? x1 - radius - widthBetweenRadiuses : 0;
      const y = isOnTopSide ? y1 - radius : isOnBottomSide ? y1 - radius - heightBetweenRadiuses : 0;

      const distanceToCenterSquared = x * x + y * y;
      const isNearEdge =
        distanceToCenterSquared <= radiusPlusOneSquared &&
        distanceToCenterSquared >= radiusMinusSpecularSquared;

      if (isNearEdge) {
        const distanceFromCenter = Math.sqrt(distanceToCenterSquared);
        const distanceFromSide = radius - distanceFromCenter;
        const opacity = distanceToCenterSquared < radiusSquared
          ? 1
          : 1 - (distanceFromCenter - Math.sqrt(radiusSquared)) /
            (Math.sqrt(radiusPlusOneSquared) - Math.sqrt(radiusSquared));
        const cos = distanceFromCenter > 0 ? x / distanceFromCenter : 0;
        const sin = distanceFromCenter > 0 ? -y / distanceFromCenter : 0;
        const dotProduct = Math.abs(cos * specularVector[0] + sin * specularVector[1]);
        const edgeRatio = Math.max(0, Math.min(1, distanceFromSide / specularThickness));
        const sharpFalloff = Math.sqrt(1 - (1 - edgeRatio) * (1 - edgeRatio));
        const coefficient = dotProduct * sharpFalloff;
        const color = Math.min(255, 255 * coefficient);
        const finalOpacity = Math.min(255, color * coefficient * opacity);

        imageData.data[idx] = color;
        imageData.data[idx + 1] = color;
        imageData.data[idx + 2] = color;
        imageData.data[idx + 3] = finalOpacity;
      }
    }
  }
  return imageData;
}

function imageDataToDataURL(imageData) {
  const canvas = document.createElement('canvas');
  canvas.width = imageData.width;
  canvas.height = imageData.height;
  canvas.getContext('2d').putImageData(imageData, 0, 0);
  return canvas.toDataURL();
}

/* ================================================================
   LIQUID GLASS SLIDER FACTORY
   ================================================================ */
let uidCounter = 0;
function createGlassSlider(mountEl, opts = {}) {
  const {
    initialValue = 10,
    onChange = null,
    width = 330,
    height = 60,
    trackHeight = 14,
    thumbWidth = 90,
    thumbHeight = 60,
    thumbRadius = 30,
    bezelWidth = 16,
    glassThickness = 80,
    refractiveIndex = 1.45,
    restScale = 0.6,
    dragScale = 1,
    blurLevel = 0,
    specularOpacity = 0.4,
    specularSaturation = 7,
  } = opts;

  uidCounter++;
  const uid = 'lg' + uidCounter;

  const container = document.createElement('div');
  container.className = 'lg-slider-container';
  container.style.width = width + 'px';
  container.style.height = height + 'px';
  container.innerHTML = `
    <div class="lg-slider-track">
      <div class="lg-slider-track-inner"><div class="lg-slider-fill"></div></div>
    </div>
    <div class="lg-slider-thumb">
      <div class="lg-slider-thumb-clone"><div class="lg-slider-thumb-clone-inner"></div></div>
      <svg class="lg-glass-filter-svg" style="width:0;height:0;position:absolute">
        <defs>
          <filter id="${uid}Filter" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
            <feGaussianBlur id="${uid}Blur" in="SourceGraphic" stdDeviation="${blurLevel}" result="blurred_source" />
            <feImage id="${uid}DispImage" href="" x="0" y="0" width="${thumbWidth}" height="${thumbHeight}" result="displacement_map" preserveAspectRatio="none" />
            <feDisplacementMap id="${uid}DispMap" in="blurred_source" in2="displacement_map" scale="30" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            <feColorMatrix id="${uid}Saturation" in="displaced" type="saturate" values="${specularSaturation}" result="displaced_saturated" />
            <feImage id="${uid}SpecImage" href="" x="0" y="0" width="${thumbWidth}" height="${thumbHeight}" result="specular_layer" preserveAspectRatio="none" />
            <feComposite in="displaced_saturated" in2="specular_layer" operator="in" result="specular_saturated" />
            <feComponentTransfer in="specular_layer" result="specular_faded">
              <feFuncA id="${uid}SpecAlpha" type="linear" slope="${specularOpacity}" />
            </feComponentTransfer>
            <feBlend in="specular_saturated" in2="displaced" mode="normal" result="withSaturation" />
            <feBlend in="specular_faded" in2="withSaturation" mode="normal" />
          </filter>
        </defs>
      </svg>
      <div class="lg-slider-thumb-inner"></div>
    </div>
  `;
  mountEl.appendChild(container);

  const trackEl = container.querySelector('.lg-slider-track');
  const fillEl = container.querySelector('.lg-slider-fill');
  const thumbEl = container.querySelector('.lg-slider-thumb');
  const cloneEl = container.querySelector('.lg-slider-thumb-clone');
  const cloneInnerEl = container.querySelector('.lg-slider-thumb-clone-inner');

  thumbEl.style.width = thumbWidth + 'px';
  thumbEl.style.height = thumbHeight + 'px';
  thumbEl.style.borderRadius = (thumbHeight / 2) + 'px';
  trackEl.style.width = width + 'px';
  trackEl.style.height = trackHeight + 'px';
  trackEl.style.top = ((height - trackHeight) / 2) + 'px';
  fillEl.style.height = trackHeight + 'px';
  cloneEl.style.filter = `url(#${uid}Filter)`;

  const state = {
    value: initialValue,
    pointerDown: false,
    maximumDisplacement: 0,
    specularOpacity,
    specularSaturation,
    blur: blurLevel,
    refractionBase: 1,
  };

  const springs = {
    scale: new Spring(restScale, 2000, 80),
    backgroundOpacity: new Spring(1, 2000, 80),
    scaleRatio: new Spring(0.4, 100, 10),
  };

  let animationId = null;

  function isActive() { return state.pointerDown; }

  function updateFilter() {
    const surfaceFn = SurfaceEquations.convex_squircle;
    const precomputed = calculateDisplacementMap1D(glassThickness, bezelWidth, surfaceFn, refractiveIndex);
    state.maximumDisplacement = Math.max(...precomputed.map(Math.abs));

    const displacementData = calculateDisplacementMap2D(
      thumbWidth, thumbHeight, thumbWidth, thumbHeight, thumbRadius, bezelWidth,
      state.maximumDisplacement || 1, precomputed
    );
    const specularData = calculateSpecularHighlight(thumbWidth, thumbHeight, thumbRadius, bezelWidth);

    document.getElementById(uid + 'DispImage').setAttribute('href', imageDataToDataURL(displacementData));
    document.getElementById(uid + 'SpecImage').setAttribute('href', imageDataToDataURL(specularData));
    document.getElementById(uid + 'SpecAlpha').setAttribute('slope', state.specularOpacity);
    document.getElementById(uid + 'Blur').setAttribute('stdDeviation', state.blur);
    document.getElementById(uid + 'Saturation').setAttribute('values', state.specularSaturation);
  }

  function animationLoop() {
    const dt = Math.min(0.032, 1 / 60);
    const active = isActive();

    springs.scale.setTarget(active ? dragScale : restScale);
    springs.backgroundOpacity.setTarget(active ? 0.1 : 1);
    springs.scaleRatio.setTarget((active ? 0.9 : 0.4) * state.refractionBase);

    const scale = springs.scale.update(dt);
    const backgroundOpacity = springs.backgroundOpacity.update(dt);
    const scaleRatio = springs.scaleRatio.update(dt);

    thumbEl.style.transform = `scale(${scale})`;
    thumbEl.style.backgroundColor = `rgba(255,255,255,${backgroundOpacity})`;
    cloneEl.style.opacity = 1 - backgroundOpacity;

    const dynamicScale = state.maximumDisplacement * scaleRatio;
    document.getElementById(uid + 'DispMap').setAttribute('scale', dynamicScale);

    if (!Object.values(springs).every(s => s.isSettled())) {
      animationId = requestAnimationFrame(animationLoop);
    } else {
      animationId = null;
    }
  }

  function startAnimation() {
    if (!animationId) animationId = requestAnimationFrame(animationLoop);
  }

  function updateUI() {
    fillEl.style.width = state.value + '%';

    const thumbWidthRest = thumbWidth * restScale;
    const ratio = state.value / 100;
    const x0 = thumbWidthRest / 2;
    const x100 = width - thumbWidthRest / 2;
    const thumbCenterX = x0 + ratio * (x100 - x0);
    const thumbX = thumbCenterX - thumbWidth / 2;
    thumbEl.style.left = thumbX + 'px';

    const dashboard = document.getElementById('dashboard');
    if (!dashboard) return;
    const areaRect = dashboard.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();

    cloneInnerEl.style.width = areaRect.width + 'px';
    cloneInnerEl.style.height = areaRect.height + 'px';
    const offsetX = containerRect.left - areaRect.left + thumbX;
    const offsetY = containerRect.top - areaRect.top + (height - thumbHeight) / 2;
    cloneInnerEl.style.transform = `translate(${-offsetX}px, ${-offsetY}px)`;

    const trackTop = (height - trackHeight) / 2;
    cloneInnerEl.style.setProperty('--track-left', `${containerRect.left - areaRect.left}px`);
    cloneInnerEl.style.setProperty('--track-top', `${containerRect.top - areaRect.top + trackTop}px`);
    cloneInnerEl.style.setProperty('--fill-width', state.value.toString());

    if (typeof onChange === 'function') onChange(state.value);
  }

  function onPointerDown(e) {
    e.preventDefault();
    state.pointerDown = true;
    startAnimation();
  }

  function onPointerMove(e) {
    if (!state.pointerDown) return;
    e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const trackRect = trackEl.getBoundingClientRect();
    const thumbWidthRest = thumbWidth * restScale;
    const x0 = trackRect.left + thumbWidthRest / 2;
    const x100 = trackRect.right - thumbWidthRest / 2;
    const x = Math.max(x0, Math.min(x100, clientX));
    const ratio = (x - x0) / (x100 - x0);
    state.value = Math.max(0, Math.min(100, ratio * 100));
    updateUI();
  }

  function onPointerUp() {
    state.pointerDown = false;
    startAnimation();
  }

  thumbEl.addEventListener('mousedown', onPointerDown);
  thumbEl.addEventListener('touchstart', onPointerDown, { passive: false });
  trackEl.addEventListener('mousedown', (e) => { onPointerDown(e); onPointerMove(e); });

  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('touchmove', onPointerMove, { passive: false });
  window.addEventListener('mouseup', onPointerUp);
  window.addEventListener('touchend', onPointerUp);

  updateFilter();
  updateUI();
  startAnimation();

  return {
    element: container,
    getValue: () => state.value,
    setValue: (v) => { state.value = Math.max(0, Math.min(100, v)); updateUI(); },
    setSpecularOpacity: (v) => { state.specularOpacity = v; document.getElementById(uid + 'SpecAlpha').setAttribute('slope', v); },
    setSaturation: (v) => { state.specularSaturation = v; document.getElementById(uid + 'Saturation').setAttribute('values', v); },
    setBlur: (v) => { state.blur = v; document.getElementById(uid + 'Blur').setAttribute('stdDeviation', v); },
    setRefraction: (v) => { state.refractionBase = v; startAnimation(); },
    refresh: updateUI,
  };
}

/* ================================================================
   LIQUID GLASS SWITCH / TOGGLE FACTORY
   ================================================================ */
function createGlassSwitch(mountEl, opts = {}) {
  const {
    checked = false,
    onChange = null,
    trackWidth = 72,
    trackHeight = 34,
    thumbWidth = 66,
    thumbHeight = 42,
    thumbRadius = 21,
    bezelWidth = 12,
    glassThickness = 40,
    refractiveIndex = 1.5,
    restScale = 0.65,
    activeScale = 0.9,
    label = '',
  } = opts;

  uidCounter++;
  const uid = 'sw' + uidCounter;

  const restOffset = ((1 - restScale) * thumbWidth) / 2;
  const travel = trackWidth - trackHeight - (thumbWidth - thumbHeight) * restScale;

  const wrap = document.createElement('div');
  wrap.className = 'lg-switch-label';
  wrap.innerHTML = `
    ${label ? `<span>${label}</span>` : ''}
    <div class="lg-switch-container">
      <div class="lg-switch-track" style="width:${trackWidth}px;height:${trackHeight}px;border-radius:${trackHeight/2}px;">
        <div class="lg-switch-thumb" style="width:${thumbWidth}px;height:${thumbHeight}px;border-radius:${thumbRadius}px;">
          <div class="lg-switch-thumb-clone">
            <div class="lg-switch-thumb-clone-inner"></div>
          </div>
          <svg class="lg-glass-filter-svg" style="width:0;height:0;position:absolute">
            <defs>
              <filter id="${uid}Filter" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
                <feGaussianBlur id="${uid}Blur" in="SourceGraphic" stdDeviation="0.2" result="blurred_source" />
                <feImage id="${uid}DispImage" href="" x="0" y="0" width="${thumbWidth}" height="${thumbHeight}" result="displacement_map" preserveAspectRatio="none" />
                <feDisplacementMap id="${uid}DispMap" in="blurred_source" in2="displacement_map" scale="25" xChannelSelector="R" yChannelSelector="G" result="displaced" />
                <feColorMatrix id="${uid}Saturation" in="displaced" type="saturate" values="6" result="displaced_saturated" />
                <feImage id="${uid}SpecImage" href="" x="0" y="0" width="${thumbWidth}" height="${thumbHeight}" result="specular_layer" preserveAspectRatio="none" />
                <feComposite in="displaced_saturated" in2="specular_layer" operator="in" result="specular_saturated" />
                <feComponentTransfer in="specular_layer" result="specular_faded">
                  <feFuncA id="${uid}SpecAlpha" type="linear" slope="0.5" />
                </feComponentTransfer>
                <feBlend in="specular_saturated" in2="displaced" mode="normal" result="withSaturation" />
                <feBlend in="specular_faded" in2="withSaturation" mode="normal" />
              </filter>
            </defs>
          </svg>
          <div class="lg-switch-thumb-inner"></div>
        </div>
      </div>
    </div>
  `;
  mountEl.appendChild(wrap);

  const trackEl = wrap.querySelector('.lg-switch-track');
  const thumbEl = wrap.querySelector('.lg-switch-thumb');
  const cloneEl = wrap.querySelector('.lg-switch-thumb-clone');
  const cloneInnerEl = wrap.querySelector('.lg-switch-thumb-clone-inner');

  cloneEl.style.filter = `url(#${uid}Filter)`;

  const state = {
    checked: !!checked,
    pointerDown: false,
    initialPointerX: 0,
    xDragRatio: checked ? 1 : 0,
    specularOpacity: 0.5,
    specularSaturation: 6,
    refractionBase: 1,
    blur: 0.2,
    maximumDisplacement: 0,
  };

  const springs = {
    xRatio: new Spring(state.checked ? 1 : 0, 1000, 80),
    scale: new Spring(restScale, 2000, 80),
    backgroundOpacity: new Spring(1, 2000, 80),
    trackColor: new Spring(state.checked ? 1 : 0, 1000, 80),
    scaleRatio: new Spring(0.4, 100, 10),
  };

  let animationId = null;

  function isActive() { return state.pointerDown; }

  function updateFilter() {
    const surfaceFn = SurfaceEquations.convex_squircle;
    const precomputed = calculateDisplacementMap1D(glassThickness, bezelWidth, surfaceFn, refractiveIndex);
    state.maximumDisplacement = Math.max(...precomputed.map(Math.abs));

    const displacementData = calculateDisplacementMap2D(
      thumbWidth, thumbHeight, thumbWidth, thumbHeight, thumbRadius, bezelWidth,
      state.maximumDisplacement || 1, precomputed
    );
    const specularData = calculateSpecularHighlight(thumbWidth, thumbHeight, thumbRadius, bezelWidth);

    document.getElementById(uid + 'DispImage').setAttribute('href', imageDataToDataURL(displacementData));
    document.getElementById(uid + 'SpecImage').setAttribute('href', imageDataToDataURL(specularData));
    document.getElementById(uid + 'SpecAlpha').setAttribute('slope', state.specularOpacity);
    document.getElementById(uid + 'Blur').setAttribute('stdDeviation', state.blur);
    document.getElementById(uid + 'Saturation').setAttribute('values', state.specularSaturation);
  }

  function animationLoop() {
    const dt = Math.min(0.032, 1 / 60);
    const active = isActive();

    springs.scale.setTarget(active ? activeScale : restScale);
    springs.backgroundOpacity.setTarget(active ? 0.1 : 1);
    springs.scaleRatio.setTarget((active ? 0.9 : 0.4) * state.refractionBase);

    if (!state.pointerDown) {
      springs.xRatio.setTarget(state.checked ? 1 : 0);
    }

    const considerChecked = state.pointerDown
      ? (state.xDragRatio > 0.5 ? 1 : 0)
      : (state.checked ? 1 : 0);
    springs.trackColor.setTarget(considerChecked);

    const xRatio = springs.xRatio.update(dt);
    const scale = springs.scale.update(dt);
    const backgroundOpacity = springs.backgroundOpacity.update(dt);
    const trackColor = springs.trackColor.update(dt);
    const scaleRatio = springs.scaleRatio.update(dt);

    const marginLeft = -restOffset + (trackHeight - thumbHeight * restScale) / 2;
    const thumbX = marginLeft + xRatio * travel;

    thumbEl.style.left = thumbX + 'px';
    thumbEl.style.transform = `translateY(-50%) scale(${scale})`;
    thumbEl.style.backgroundColor = `rgba(255,255,255,${backgroundOpacity})`;
    cloneEl.style.opacity = 1 - backgroundOpacity;

    if (state.pointerDown) {
      thumbEl.style.boxShadow = '0 4px 14px rgba(0,0,0,0.12), inset 2px 5px 16px rgba(0,0,0,0.08), inset -2px -5px 16px rgba(255,255,255,0.08)';
    } else {
      thumbEl.style.boxShadow = '0 4px 14px rgba(0,0,0,0.12)';
    }

    const offR = 148, offG = 148, offB = 159, offA = 0.47;
    const onR = 59, onG = 191, onB = 78, onA = 0.93;
    const r = Math.round(offR + (onR - offR) * trackColor);
    const g = Math.round(offG + (onG - offG) * trackColor);
    const b = Math.round(offB + (onB - offB) * trackColor);
    const a = offA + (onA - offA) * trackColor;
    const trackBgColor = `rgba(${r},${g},${b},${a})`;
    trackEl.style.backgroundColor = trackBgColor;

    const area = mountEl.closest('.panel') || mountEl.closest('.topbar') || mountEl.closest('.widget') || document.body;
    const areaRect = area.getBoundingClientRect();
    const trackRect = trackEl.getBoundingClientRect();
    const containerLeft = trackRect.left - areaRect.left;
    const containerTop = trackRect.top - areaRect.top;

    cloneInnerEl.style.width = areaRect.width + 'px';
    cloneInnerEl.style.height = areaRect.height + 'px';
    const thumbYOffset = trackHeight / 2 - thumbHeight / 2;
    cloneInnerEl.style.transform = `translate(${-(containerLeft + thumbX)}px, ${-(containerTop + thumbYOffset)}px)`;
    cloneInnerEl.style.setProperty('--switch-track-color', trackBgColor);
    cloneInnerEl.style.setProperty('--track-left', `${containerLeft}px`);
    cloneInnerEl.style.setProperty('--track-top', `${containerTop}px`);

    const dynamicScale = state.maximumDisplacement * scaleRatio;
    document.getElementById(uid + 'DispMap').setAttribute('scale', dynamicScale);

    if (!Object.values(springs).every(s => s.isSettled())) {
      animationId = requestAnimationFrame(animationLoop);
    } else {
      animationId = null;
    }
  }

  function startAnimation() {
    if (!animationId) animationId = requestAnimationFrame(animationLoop);
  }

  function onPointerDown(e) {
    e.preventDefault();
    e.stopPropagation();
    state.pointerDown = true;
    state.initialPointerX = e.touches ? e.touches[0].clientX : e.clientX;
    state.xDragRatio = state.checked ? 1 : 0;
    startAnimation();
  }

  function onPointerMove(e) {
    if (!state.pointerDown) return;
    e.stopPropagation();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const baseRatio = state.checked ? 1 : 0;
    const displacementX = clientX - state.initialPointerX;
    let ratio = baseRatio + displacementX / travel;
    const overflow = ratio < 0 ? -ratio : ratio > 1 ? ratio - 1 : 0;
    const overflowSign = ratio < 0 ? -1 : 1;
    const dampedOverflow = (overflowSign * overflow) / 22;
    state.xDragRatio = Math.min(1, Math.max(0, ratio)) + dampedOverflow;
    springs.xRatio.setTarget(state.xDragRatio);
    startAnimation();
  }

  function onPointerUp(e) {
    if (!state.pointerDown) return;
    state.pointerDown = false;
    const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
    const distance = Math.abs(clientX - state.initialPointerX);
    if (distance < 4) {
      state.checked = !state.checked;
    } else {
      state.checked = state.xDragRatio > 0.5;
    }
    if (typeof onChange === 'function') onChange(state.checked);
    startAnimation();
  }

  thumbEl.addEventListener('mousedown', onPointerDown);
  thumbEl.addEventListener('touchstart', onPointerDown, { passive: false });
  trackEl.addEventListener('click', (e) => {
    if (e.target === trackEl) {
      state.checked = !state.checked;
      if (typeof onChange === 'function') onChange(state.checked);
      startAnimation();
    }
  });

  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('touchmove', onPointerMove, { passive: false });
  window.addEventListener('mouseup', onPointerUp);
  window.addEventListener('touchend', onPointerUp);

  updateFilter();
  startAnimation();

  return {
    element: wrap,
    getChecked: () => state.checked,
    setChecked: (v) => {
      state.checked = !!v;
      startAnimation();
    },
  };
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch {
    return null;
  }
}

function saveState() {
  const data = {
    glassiness: masterSlider ? masterSlider.getValue() : 55,
    bgIndex: currentBgIndex,
    bgUrl: lastBgUrl || null,
    bgDataUrl: lastBgDataUrl || null,
    showGrid: !document.body.classList.contains('no-grid'),
    darkTint: document.documentElement.style.getPropertyValue('--text-primary') !== '#1a1f2e',
    locked: widgetState.locked,
    widgets: [],
    newsTopic: lastNewsTopic,
    weatherQuery: lastWeatherQuery,
    weatherUnit: lastWeatherUnit,
  };
  widgetState.widgets.forEach(rec => {
    data.widgets.push({
      id: rec.id,
      type: rec.type,
      x: rec.x,
      y: rec.y,
      w: rec.w || null,
      h: rec.h || null,
      locked: rec.el.classList.contains('locked'),
    });
  });
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn('Save failed', e);
  }
}

let saveTimer = null;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 400);
}

/* ================================================================
   WIDGET INFRASTRUCTURE — drag + resize
   ================================================================ */
const dashboard = document.getElementById('dashboard');
const widgetState = {
  locked: false,
  nextId: 1,
  widgets: new Map(),
};

function getWidgetTemplate(type) {
  switch (type) {
    case 'weather': return weatherWidgetHTML();
    case 'tasks': return tasksWidgetHTML();
    case 'news': return newsWidgetHTML();
    case 'timers': return timersWidgetHTML();
    case 'music': return musicWidgetHTML();
    case 'clock': return clockWidgetHTML();
    case 'notes': return notesWidgetHTML();
    case 'calculator': return calculatorWidgetHTML();
    default: return `<div style="padding:10px;font-size:12px;">Unknown widget</div>`;
  }
}

function getWidgetMeta(type) {
  const map = {
    weather:    { icon: '🌤', title: 'Weather', desc: 'City / ZIP via Open-Meteo' },
    tasks:      { icon: '✅', title: 'Google Tasks', desc: 'Real Google Tasks via OAuth' },
    news:       { icon: '📰', title: 'Hot Topics', desc: 'Live headlines from GDELT' },
    timers:     { icon: '⏱', title: 'Timers', desc: 'Countdown with slider + type' },
    music:      { icon: '🎵', title: 'Music & Radio', desc: 'Audius tracks + Radio Browser' },
    clock:      { icon: '🕐', title: 'Clock', desc: 'Live local time' },
    notes:      { icon: '📝', title: 'Notes', desc: 'Scratchpad stored locally' },
    calculator: { icon: '🧮', title: 'Calculator', desc: 'Quick arithmetic' },
  };
  return map[type] || { icon: '◻', title: type, desc: '' };
}

function addWidget(type, x, y, restoreId = null, restoreLocked = false, restoreW = null, restoreH = null) {
  const id = restoreId != null ? restoreId : widgetState.nextId++;
  if (id >= widgetState.nextId) widgetState.nextId = id + 1;

  const el = document.createElement('div');
  el.className = 'widget glass ' + (type === 'music' ? 'w-lg' : 'w-md');
  el.dataset.widgetId = id;
  el.dataset.widgetType = type;
  el.style.left = (x ?? 40 + (widgetState.widgets.size % 4) * 40) + 'px';
  el.style.top = (y ?? 40 + (widgetState.widgets.size % 4) * 40) + 'px';
  if (restoreW) el.style.width = restoreW + 'px';
  if (restoreH) el.style.height = restoreH + 'px';

  el.innerHTML = `
    <div class="widget-head">
      <div class="drag-grip"></div>
      <div class="widget-title">${getWidgetMeta(type).title}</div>
      <div class="widget-actions">
        <button class="icon-btn lock-btn" title="Lock this widget">🔓</button>
        <button class="icon-btn danger remove-btn" title="Remove widget">✕</button>
      </div>
    </div>
    <div class="widget-body">${getWidgetTemplate(type)}</div>
    <div class="resize-handle" title="Resize"></div>
  `;
  dashboard.appendChild(el);

  const record = {
    id, type, el,
    x: parseFloat(el.style.left),
    y: parseFloat(el.style.top),
    w: restoreW || el.offsetWidth,
    h: restoreH || el.offsetHeight,
  };
  widgetState.widgets.set(id, record);

  if (restoreLocked || widgetState.locked) {
    el.classList.add('locked');
    const btn = el.querySelector('.lock-btn');
    if (btn) btn.textContent = '🔒';
  }

  el.querySelector('.remove-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    removeWidget(id);
  });
  el.querySelector('.lock-btn').addEventListener('click', (e) => {
    e.stopPropagation();
    const rec = widgetState.widgets.get(id);
    if (!rec) return;
    rec.el.classList.toggle('locked');
    rec.el.querySelector('.lock-btn').textContent = rec.el.classList.contains('locked') ? '🔒' : '🔓';
    scheduleSave();
  });

  makeDraggable(el, record);
  makeResizable(el, record);
  initWidgetLogic(type, el, id);
  scheduleSave();
  if (!restoreId) toast(`Added ${getWidgetMeta(type).title} widget`);
}

function removeWidget(id) {
  const rec = widgetState.widgets.get(id);
  if (!rec) return;
  rec.el.remove();
  widgetState.widgets.delete(id);
  scheduleSave();
  toast('Widget removed');
}

function makeDraggable(el, record) {
  const head = el.querySelector('.widget-head');
  let startX = 0, startY = 0, originX = 0, originY = 0, dragging = false;

  function onMove(e) {
    if (!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return;
    let nx = originX + dx;
    let ny = originY + dy;
    const rect = dashboard.getBoundingClientRect();
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    nx = Math.max(8, Math.min(rect.width - w - 8, nx));
    ny = Math.max(8, Math.min(rect.height - h - 8, ny));
    el.style.left = nx + 'px';
    el.style.top = ny + 'px';
    record.x = nx;
    record.y = ny;
  }

  function onUp() {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    scheduleSave();
  }

  head.addEventListener('pointerdown', (e) => {
    if (widgetState.locked || el.classList.contains('locked')) return;
    if (e.target.closest('.icon-btn') || e.target.closest('button') ||
        e.target.closest('input') || e.target.closest('select') || e.target.closest('textarea')) return;
    if (e.button !== undefined && e.button !== 0) return;

    dragging = true;
    el.classList.add('dragging');
    startX = e.clientX;
    startY = e.clientY;
    originX = parseFloat(el.style.left) || 0;
    originY = parseFloat(el.style.top) || 0;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
    e.preventDefault();
  });
}

function makeResizable(el, record) {
  const handle = el.querySelector('.resize-handle');
  if (!handle) return;
  let startX = 0, startY = 0, startW = 0, startH = 0, resizing = false;

  function onMove(e) {
    if (!resizing) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    let nw = Math.max(240, startW + dx);
    let nh = Math.max(180, startH + dy);
    const rect = dashboard.getBoundingClientRect();
    nw = Math.min(nw, rect.width - record.x - 8);
    nh = Math.min(nh, rect.height - record.y - 8);
    el.style.width = nw + 'px';
    el.style.height = nh + 'px';
    record.w = nw;
    record.h = nh;
  }

  function onUp() {
    if (!resizing) return;
    resizing = false;
    el.classList.remove('resizing');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
    scheduleSave();
  }

  handle.addEventListener('pointerdown', (e) => {
    if (widgetState.locked || el.classList.contains('locked')) return;
    e.preventDefault();
    e.stopPropagation();
    resizing = true;
    el.classList.add('resizing');
    startX = e.clientX;
    startY = e.clientY;
    startW = el.offsetWidth;
    startH = el.offsetHeight;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
}

function setLocked(locked) {
  widgetState.locked = locked;
  widgetState.widgets.forEach(rec => {
    if (locked) {
      rec.el.classList.add('locked');
      const btn = rec.el.querySelector('.lock-btn');
      if (btn) btn.textContent = '🔒';
    }
  });
  scheduleSave();
  toast(locked ? 'Layout locked' : 'Layout unlocked');
}

/* ================================================================
   WIDGET LOGIC — WEATHER (Open-Meteo + °C/°F toggle)
   ================================================================ */
let lastWeatherQuery = '';
let lastWeatherUnit = 'c'; // 'c' or 'f'
const weatherLastFetch = new Map();

function initWeather(el) {
  const wIcon = el.querySelector('#wIcon');
  const wTemp = el.querySelector('#wTemp');
  const wMeta = el.querySelector('#wMeta');
  const wFeels = el.querySelector('#wFeels');
  const wHum = el.querySelector('#wHum');
  const wWind = el.querySelector('#wWind');
  const wCond = el.querySelector('#wCond');
  const wStatus = el.querySelector('#wStatus');
  const wQuery = el.querySelector('#wQuery');
  const wGo = el.querySelector('#wGo');
  const wRefresh = el.querySelector('#wRefresh');
  const wLocate = el.querySelector('#wLocate');
  const unitMount = el.querySelector('#wUnitMount');

  let useFahrenheit = lastWeatherUnit === 'f';
  let lastRaw = null;

  if (lastWeatherQuery) wQuery.value = lastWeatherQuery;

  if (unitMount) {
    createGlassSwitch(unitMount, {
      checked: useFahrenheit,
      label: '°F',
      trackWidth: 64,
      trackHeight: 30,
      thumbWidth: 56,
      thumbHeight: 36,
      onChange: (v) => {
        useFahrenheit = v;
        lastWeatherUnit = v ? 'f' : 'c';
        scheduleSave();
        if (lastRaw) applyWeatherData(lastRaw);
      },
    });
  }

  function getWeatherIcon(code, isDay) {
    const day = isDay === 1;
    const map = {
      0:  day ? '☀️' : '🌙',
      1:  day ? '🌤' : '🌥',
      2:  day ? '⛅' : '☁️',
      3:  '☁️',
      45: '🌫', 48: '🌫',
      51: '🌦', 53: '🌦', 55: '🌧',
      61: '🌦', 63: '🌧', 65: '🌧',
      71: '🌨', 73: '🌨', 75: '❄️',
      80: '🌦', 81: '🌧', 82: '⛈',
      95: '⛈', 96: '⛈', 99: '⛈',
    };
    return map[code] || (day ? '🌡' : '🌙');
  }

  const weatherCodes = {
    0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
    45: 'Fog', 48: 'Rime fog',
    51: 'Light drizzle', 53: 'Drizzle', 55: 'Dense drizzle',
    61: 'Slight rain', 63: 'Rain', 65: 'Heavy rain',
    71: 'Slight snow', 73: 'Snow', 75: 'Heavy snow',
    80: 'Rain showers', 81: 'Showers', 82: 'Violent showers',
    95: 'Thunderstorm', 96: 'Thunderstorm + hail', 99: 'Thunderstorm + heavy hail',
  };

  function setStatus(msg) { if (wStatus) wStatus.textContent = msg; }

  function toDisplayTemp(celsius) {
    if (useFahrenheit) return Math.round(celsius * 9 / 5 + 32) + '°F';
    return Math.round(celsius) + '°C';
  }

  function applyWeatherData(data) {
    lastRaw = data;
    const cur = data.current;
    const code = cur.weather_code;
    const isDay = cur.is_day;
    const condition = weatherCodes[code] || 'Unknown';
    const icon = getWeatherIcon(code, isDay);

    wIcon.textContent = icon;
    wTemp.textContent = toDisplayTemp(cur.temperature_2m);
    wFeels.textContent = toDisplayTemp(cur.apparent_temperature);
    wHum.textContent = cur.relative_humidity_2m + '%';
    wWind.textContent = Math.round(cur.wind_speed_10m) + ' km/h';
    wCond.textContent = condition;
    wMeta.textContent = data.label + ' · ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setStatus('✅ Updated');
  }

  async function fetchWeather(lat, lon, label) {
    const key = `${lat.toFixed(2)},${lon.toFixed(2)}`;
    const now = Date.now();
    if (weatherLastFetch.has(key) && now - weatherLastFetch.get(key) < 30000) {
      setStatus('⏳ Cached — wait 30s to refresh');
      return;
    }
    weatherLastFetch.set(key, now);

    setStatus('⏳ Fetching weather…');
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,is_day&timezone=auto`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      data.label = label;
      applyWeatherData(data);
    } catch (err) {
      console.error('Weather error:', err);
      setStatus('⚠️ Could not fetch weather');
      wTemp.textContent = '--°';
    }
  }

  async function resolveAndFetch(query) {
    const q = (query || '').trim();
    if (!q) {
      setStatus('Enter a city or ZIP');
      return;
    }
    lastWeatherQuery = q;
    scheduleSave();
    setStatus('🔍 Looking up location…');
    try {
      const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`;
      const geoRes = await fetch(geoUrl);
      if (!geoRes.ok) throw new Error('Geocode HTTP ' + geoRes.status);
      const geoData = await geoRes.json();
      const place = geoData.results?.[0];
      if (!place) {
        setStatus('⚠️ Location not found');
        return;
      }
      const label = [place.name, place.admin1, place.country_code].filter(Boolean).join(', ');
      await fetchWeather(place.latitude, place.longitude, label);
    } catch (err) {
      console.error('Geocode error:', err);
      setStatus('⚠️ Could not resolve location');
    }
  }

  function geolocate() {
    if (!navigator.geolocation) {
      resolveAndFetch('London');
      return;
    }
    setStatus('📍 Getting location…');
    navigator.geolocation.getCurrentPosition(
      (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, 'My location'),
      () => {
        setStatus('⚠️ Location denied — enter city/ZIP');
      },
      { timeout: 8000 }
    );
  }

  wGo.addEventListener('click', () => resolveAndFetch(wQuery.value));
  wQuery.addEventListener('keydown', (e) => { if (e.key === 'Enter') resolveAndFetch(wQuery.value); });
  wRefresh.addEventListener('click', () => {
    if (lastWeatherQuery) resolveAndFetch(lastWeatherQuery);
    else geolocate();
  });
  wLocate.addEventListener('click', geolocate);

  if (lastWeatherQuery) {
    resolveAndFetch(lastWeatherQuery);
  } else {
    setStatus('Enter a city or ZIP code');
  }
}

/* ================================================================
   WIDGET LOGIC — GOOGLE TASKS
   ================================================================ */
function initTasks(el) {
  const signOutBlock = el.querySelector('#tasksSignedOut');
  const signInBlock = el.querySelector('#tasksSignedIn');
  const signInBtn = el.querySelector('#tasksSignIn');
  const signOutBtn = el.querySelector('#tasksSignOut');
  const listEl = el.querySelector('#tasksList');
  const listNameEl = el.querySelector('#tasksListName');
  const inputEl = el.querySelector('#tasksInput');
  const addBtn = el.querySelector('#tasksAdd');

  let accessToken = null;
  let taskListId = null;

  function showSignedIn() {
    signOutBlock.style.display = 'none';
    signInBlock.style.display = 'block';
  }
  function showSignedOut() {
    signOutBlock.style.display = 'block';
    signInBlock.style.display = 'none';
  }

  async function loadTasks() {
    if (!accessToken) return;
    listEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:6px;">Loading tasks…</div>';
    try {
      const listsRes = await fetch('https://tasks.googleapis.com/tasks/v1/users/@me/lists', {
        headers: { Authorization: 'Bearer ' + accessToken },
      });
      if (!listsRes.ok) throw new Error('Lists HTTP ' + listsRes.status);
      const listsData = await listsRes.json();
      const firstList = listsData.items?.[0];
      if (!firstList) {
        listEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:6px;">No task lists found.</div>';
        return;
      }
      taskListId = firstList.id;
      listNameEl.textContent = firstList.title || 'My Tasks';

      const tasksRes = await fetch(
        `https://tasks.googleapis.com/tasks/v1/lists/${taskListId}/tasks?showCompleted=true&maxResults=20`,
        { headers: { Authorization: 'Bearer ' + accessToken } }
      );
      if (!tasksRes.ok) throw new Error('Tasks HTTP ' + tasksRes.status);
      const tasksData = await tasksRes.json();
      renderTasks(tasksData.items || []);
    } catch (err) {
      console.error('Tasks error:', err);
      listEl.innerHTML = '<div style="font-size:11px;opacity:.6;padding:6px;">⚠️ Failed to load tasks.</div>';
    }
  }

  function renderTasks(items) {
    if (!items.length) {
      listEl.innerHTML = '<div style="font-size:11px;opacity:.5;padding:6px;">No tasks 🎉</div>';
      return;
    }
    listEl.innerHTML = items.map(t => `
      <div class="task-row ${t.status === 'completed' ? 'done' : ''}" data-task-id="${t.id}">
        <div class="task-check" data-toggle="${t.id}">✓</div>
        <div style="flex:1;min-width:0;">
          <div class="task-title">${escapeHtml(t.title || 'Untitled')}</div>
          ${t.notes ? `<div class="task-notes">${escapeHtml(t.notes)}</div>` : ''}
        </div>
      </div>
    `).join('');

    listEl.querySelectorAll('[data-toggle]').forEach(check => {
      check.addEventListener('click', async (e) => {
        e.stopPropagation();
        const row = check.closest('.task-row');
        const taskId = check.dataset.toggle;
        const wasDone = row.classList.contains('done');
        const newStatus = wasDone ? 'needsAction' : 'completed';
        row.classList.toggle('done');
        try {
          const res = await fetch(
            `https://tasks.googleapis.com/tasks/v1/lists/${taskListId}/tasks/${taskId}`,
            {
              method: 'PATCH',
              headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
              body: JSON.stringify({ status: newStatus }),
            }
          );
          if (!res.ok) throw new Error('PATCH HTTP ' + res.status);
        } catch (err) {
          console.error('Task update error:', err);
          row.classList.toggle('done');
          toast('Could not update task');
        }
      });
    });
  }

  async function addTask() {
    const title = inputEl.value.trim();
    if (!title || !accessToken || !taskListId) return;
    inputEl.value = '';
    try {
      const res = await fetch(
        `https://tasks.googleapis.com/tasks/v1/lists/${taskListId}/tasks`,
        {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        }
      );
      if (!res.ok) throw new Error('POST HTTP ' + res.status);
      await loadTasks();
    } catch (err) {
      console.error('Add task error:', err);
      toast('Could not add task');
    }
  }

  signInBtn.addEventListener('click', () => {
    if (GOOGLE_CLIENT_ID.startsWith('YOUR_')) {
      toast('Add your Google Client ID first (see top of file)');
      return;
    }
    if (typeof google === 'undefined' || !google.accounts?.oauth2) {
      toast('Google Identity Services not loaded');
      return;
    }
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: (tokenResponse) => {
        if (tokenResponse.error) {
          toast('Google sign-in failed: ' + tokenResponse.error);
          return;
        }
        accessToken = tokenResponse.access_token;
        showSignedIn();
        loadTasks();
      },
    });
    client.requestAccessToken();
  });

  signOutBtn.addEventListener('click', () => {
    if (accessToken && google?.accounts?.oauth2) {
      google.accounts.oauth2.revoke(accessToken);
    }
    accessToken = null;
    taskListId = null;
    showSignedOut();
  });

  addBtn.addEventListener('click', addTask);
  inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });
  showSignedOut();
}

      { title: 'New chip designs improve efficiency for edge devices', domain: 'tech', url: 'https://news.ycombinator.com' },

    ],
